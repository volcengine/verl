# # Tests layout

# Each folder under tests/ corresponds to a test category for a sub-namespace in verl. For instance:
# - `tests/trainer` for testing functionality related to `verl/trainer`
# - `tests/models` for testing functionality related to `verl/models`
# - ...

# There are a few folders with `special_` prefix, created for special purposes:
# - `special_distributed`: unit tests that must run with multiple GPUs
# - `special_e2e`: end-to-end tests with training/generation scripts
# - `special_npu`: tests for NPUs
# - `special_sanity`: a suite of quick sanity tests
# - `special_standalone`: a set of test that are designed to run in dedicated environments

# Accelerators for tests
# - By default tests are run with GPU available, except for the ones under `special_npu`, and any test script whose name ends with `on_cpu.py`.
# - For test scripts with `on_cpu.py` name suffix would be tested on CPU resources in linux environment.

# # Workflow layout

# All CI tests are configured by yaml files in `.github/workflows/`. Here's an overview of all test configs:
# 1. A list of always triggered CPU sanity tests: `check-pr-title.yml`, `secrets_scan.yml`, `check-pr-title,yml`, `pre-commit.yml`, `doc.yml`
# 2. Some heavy multi-GPU unit tests, such as `model.yml`, `vllm.yml`, `sgl.yml`
# 3. End-to-end tests: `e2e_*.yml`
# 4. Unit tests
#   - `cpu_unit_tests.yml`, run pytest on all scripts with file name pattern `tests/**/test_*_on_cpu.py`
#   - `gpu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix.
#   - Since cpu/gpu unit tests by default runs all tests under `tests`, please make sure tests are manually excluded in them when
#     - new workflow yaml is added to `.github/workflows`
#     - new tests are added to workflow mentioned in 2.

name: vllm

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
      - v0.*
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      # Other entrypoints
      - "!examples/**"
      - "!tests/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py"
      # FSDP
      - "!verl/workers/**/*dp_*.py"
      # Megatron
      - "!verl/workers/**/megatron_*.py"
      # SGLang
      - "!**/*sglang*"
      # Entrypoints
      - ".github/workflows/vllm.yml"
      - "tests/special_e2e/generation"
      - "tests/experimental/reward_loop/run_determinism_e2e_with_rm.py"
      - "tests/workers/rollout"
      - "verl/trainer/main_generation.py"
      - "verl/trainer/config/generation.yaml"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/config/ppo_trainer.yaml"
      # Dependency changes: this job runs `uv run --frozen`, so the lock IS
      # the environment under test - a resolution change must be validated
      # even when it touches no .py file.
      - "pyproject.toml"
      - "uv.lock"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd10g3clalm04ug7alq90.apigateway-cn-beijing.volceapi.com/runner"

jobs:
  setup:
    if: github.repository_owner == 'verl-project'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@v4
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  vllm:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 35 # Increase this timeout value as needed
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      # No install step: every command below runs through uv, which syncs .venv
      # from the committed uv.lock (offline, from the image's baked cache).
      # Keep these extras identical across the job so uv never re-syncs torch.
      UV_RUN: "uv run --frozen --all-packages --extra vllm --extra megatron"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Diagnostic: show whether this runner can reach the outside world at all
      # before uv needs it. Never fails the job.
      - name: Keep the uv cache on the runner's persistent ${HOME}
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"
      - name: Check final pip list
        run: |
          $UV_RUN uv pip list
      # These tests need no GPU but do import vllm, which the `cpu` extra cannot
      # provide (it pins the cpu torch world), so cpu_unit_tests skips them. Run
      # them here, where the vllm extra is synced.
      - name: Run vllm CPU unit tests
        run: |
          $UV_RUN pytest -s -x \
            tests/workers/rollout/test_vllm_cli_args_on_cpu.py \
            tests/workers/rollout/test_vision_placeholder_tokens_on_cpu.py \
            tests/workers/rollout/test_vllm_pd_disaggregation_on_cpu.py \
            tests/workers/rollout/rollout_vllm/test_submitter_gate_on_cpu.py \
            tests/utils/test_vllm_weight_name_normalization_on_cpu.py
      - name: Prepare gsm8k dataset
        run: |
          $UV_RUN ray stop --force
          $UV_RUN python3 examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/models/hf_data/gsm8k --local_dir ${HOME}/data/gsm8k
      - name: Test the latest vLLM Rollout async with agent loop
        run: |
          ROLLOUT_NAME=vllm $UV_RUN pytest -svvv tests/experimental/agent_loop
      - name: Test vLLM agent loop with Continuous Token
        run: |
          $UV_RUN ray stop --force
          ENABLE_CONTINUOUS_TOKEN=1 ROLLOUT_NAME=vllm $UV_RUN pytest -svvv \
            tests/experimental/agent_loop/test_basic_agent_loop.py::test_single_turn \
            tests/experimental/agent_loop/test_basic_agent_loop.py::test_tool_agent
      - name: Test vllm server abort functionality
        run: |
          $UV_RUN pytest tests/workers/rollout/rollout_vllm/test_vllm_abort.py -v -s
      # - name: Test vllm rollout generation determinism (same-instance + cross-instance + cross-instance AgentLoop)
      #   run: |
      #     VLLM_DETERMINISM_DENSE_MODEL_PATH=${HOME}/models/Qwen/Qwen2.5-0.5B-Instruct \
      #     VLLM_DETERMINISM_N_GPUS=2 \
      #     $UV_RUN pytest tests/workers/rollout/rollout_vllm/test_vllm_generation_determinism.py -v -s

  vllm_checkpoint_engine:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 35 # Increase this timeout value as needed
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      # No install step: every command below runs through uv, which syncs .venv
      # from the committed uv.lock (offline, from the image's baked cache).
      # Keep these extras identical across the job so uv never re-syncs torch.
      UV_RUN: "uv run --frozen --all-packages --extra vllm --extra megatron"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Diagnostic: show whether this runner can reach the outside world at all
      # before uv needs it. Never fails the job.
      - name: Keep the uv cache on the runner's persistent ${HOME}
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"
      - name: Check final pip list
        run: |
          $UV_RUN uv pip list
      - name: Test vLLM ServerAdapter with Checkpoint Engine (NCCL)
        run: |
          ROLLOUT_NAME=vllm $UV_RUN pytest -svvv tests/checkpoint_engine/test_special_server_adapter.py
      - name: Test bucketed weight transfer
        run: |
          $UV_RUN pytest -svvv tests/utils/test_bucketed_weight_transfer.py

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, vllm, vllm_checkpoint_engine]
    if: always()
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
