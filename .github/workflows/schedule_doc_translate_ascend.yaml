# Cross-repository translation workflow
# =====================================
#
# This workflow runs in the UPSTREAM verl source repo (verl-project/verl) and is
# triggered by schedule or manual dispatch. The upstream repo only stores the
# workflow file and the en/ translated docs; the translation tooling
# (translate_md.py, skill.md) and the .po translation memory live in a separate
# fork private repo.
#
# Repository variables (set in the upstream verl source repo):
#   FORK_REPO    the fork private repo that carries the translation tooling
#                and .po translation memory (e.g. my-org/verl-translation-fork).
#
# Required secrets (set in the upstream verl source repo):
#   FORK_TOKEN           a PAT with contents:write on the fork private repo
#                        (for checkout, push synced main, push clean branch).
#   TRANSLATION_ASCEND   LLM API key (Volcengine glm-5.2, primary).
#   LLM_API_KEY          LLM API key (used when api_base/model are overridden).
#
# Workflow:
#   1. Checkout the fork private repo's main branch (has translate_md.py,
#      skill.md, .po cache, zh/, en/).
#   2. Fetch and merge the upstream's main into the fork's main (sync).
#   3. Push the synced main back to the fork.
#   4. Run translation (translate_md.py).
#   5. Create a new branch from the fork's synced main.
#   6. On the new branch, git rm .po cache, python script, and skill file.
#   7. Stage only en/ docs and workflow files.
#   8. Push the clean branch to the fork.
#   9. Create a cross-repository PR from fork to upstream (GITHUB_TOKEN).

name: Auto Doc Translate

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch for the PR'
        required: false
        default: 'main'
        type: string
      full_translate:
        description: 'Full translation: translate ALL docs under docs/ascend_tutorial/zh/ (excluding index.rst)'
        required: false
        default: false
        type: boolean
      api_base:
        description: 'LLM API base URL (default: Volcengine gateway). Example for Zhipu AI: https://open.bigmodel.cn/api/paas/v4'
        required: false
        default: ''
        type: string
      model:
        description: 'LLM model name (default: glm-5.2). Example for Zhipu AI: glm-4-plus'
        required: false
        default: ''
        type: string

concurrency:
  group: translation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    # Runs directly in the upstream verl source repo — no enablement variable
    # needed. The fork private repo is identified by the FORK_REPO variable.
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
      # The fork private repo that carries translate_md.py, skill.md, and .po cache.
      FORK_REPO: ${{ vars.FORK_REPO }}
    steps:
      # -----------------------------------------------------------------
      # Resolve tokens:
      #   FORK_TOKEN   — PAT with contents:write on the fork private repo.
      #                 Used for checkout, push synced main, push clean branch.
      #   GITHUB_TOKEN — job-scoped token for the upstream verl source repo
      #                 (this repo). Has pull-requests:write, used for PR
      #                 creation on the upstream.
      # -----------------------------------------------------------------
      - name: Resolve tokens
        id: tokens
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FORK_REPO" ]; then
            echo "::error::FORK_REPO variable is required (fork private repo, e.g. my-org/verl-translation-fork)"
            exit 1
          fi
          if [ -z "$FORK_TOKEN" ]; then
            echo "::error::FORK_TOKEN secret is required (token with contents:write on ${FORK_REPO})"
            exit 1
          fi
          echo "fork_token=${FORK_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "FORK_OWNER=${FORK_REPO%%/*}" >> "$GITHUB_ENV"
          echo "Upstream repo: ${{ github.repository }} (GITHUB_TOKEN)"
          echo "Fork repo:     ${FORK_REPO} (FORK_TOKEN)"

      # -----------------------------------------------------------------
      # Step 1: Checkout the fork private repo's main branch.
      # The fork has translate_md.py, skill.md, .po cache, zh/, en/ that the
      # upstream does not have. Full depth is needed for the merge with
      # upstream to have the full history.
      # -----------------------------------------------------------------
      - name: Checkout fork private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FORK_REPO }}
          token: ${{ steps.tokens.outputs.fork_token }}
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      # -----------------------------------------------------------------
      # Step 2: Sync the fork's main with the latest upstream verl source
      # repo. The upstream is this repo (github.repository = verl-project/verl).
      # The merge brings in the latest Chinese source docs (zh/) and any
      # previously merged en/ docs. The fork's translation tooling
      # (translate_md.py, skill.md, .po cache) are not in the upstream, so
      # the merge adds them on top of the synced content without conflicts.
      # -----------------------------------------------------------------
      - name: Sync fork with upstream verl source repo
        env:
          FORK_TOKEN: ${{ steps.tokens.outputs.fork_token }}
        run: |
          set -euo pipefail
          # The upstream is this repo (public, no token needed for fetch).
          git remote add upstream "https://github.com/${{ github.repository }}.git"
          git fetch upstream "${TARGET_BRANCH}"
          git merge "upstream/${TARGET_BRANCH}" --no-edit -m "Sync with upstream ${{ github.repository }}@${TARGET_BRANCH}"
          # Push the synced main back to the fork so the .po translation
          # memory and the tooling stay on the fork's main branch.
          git remote set-url origin "https://x-access-token:${FORK_TOKEN}@github.com/${FORK_REPO}.git"
          git push origin "${TARGET_BRANCH}"

      # -----------------------------------------------------------------
      # Step 3: Setup Python and install dependencies.
      # -----------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai

      # -----------------------------------------------------------------
      # Step 4: Clean stale translation memory for full translation.
      # -----------------------------------------------------------------
      - name: Clean stale translation memory for full translation
        if: inputs.full_translate
        run: |
          echo "Cleaning old .po translation memory to force full retranslation..."
          rm -rf docs/ascend_tutorial/locale/en/LC_MESSAGES/
          echo "Cleaned."

      # -----------------------------------------------------------------
      # Step 5: Detect whether to translate (full vs incremental).
      # -----------------------------------------------------------------
      - name: Detect whether to translate
        id: detect
        run: |
          if [ "${{ inputs.full_translate }}" = "true" ]; then
            echo "Full translation mode"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_translate=true" >> $GITHUB_OUTPUT
          elif [ -d "docs/ascend_tutorial/en" ] && [ "$(find docs/ascend_tutorial/en/ -name '*.md' -o -name '*.rst' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Incremental mode: will detect changes via .po translation memory"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_translate=false" >> $GITHUB_OUTPUT
          else
            echo "No existing English docs — performing full translation"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_translate=true" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------
      # Step 6: Translate via LLM API.
      # translate_md.py reads the API key from env vars: TRANSLATION_ASCEND
      # first, then LLM_API_KEY as fallback.
      # -----------------------------------------------------------------
      - name: Translate via LLM API
        if: steps.detect.outputs.has_changes == 'true'
        env:
          TRANSLATION_ASCEND: ${{ secrets.TRANSLATION_ASCEND }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ inputs.api_base }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          if [ "${{ steps.detect.outputs.full_translate }}" = "true" ]; then
            python .github/workflows/scripts/translate_md.py \
              --first-time \
              --output-json /tmp/translation_results.json
          else
            python .github/workflows/scripts/translate_md.py \
              --all \
              --output-json /tmp/translation_results.json
          fi

      # -----------------------------------------------------------------
      # Step 6b: Commit updated .po translation memory back to the fork's
      # main branch so the next run can reuse cached translations and only
      # call the LLM API for changed blocks (incremental translation).
      # Without this step every run would re-translate all blocks because
      # the .po cache on the fork's main would never be updated.
      # -----------------------------------------------------------------
      - name: Commit translation memory to fork main
        if: steps.detect.outputs.has_changes == 'true'
        env:
          FORK_TOKEN: ${{ steps.tokens.outputs.fork_token }}
        run: |
          set -euo pipefail
          # Only proceed if .po cache files were actually modified.
          if [ ! -d docs/ascend_tutorial/locale/en/LC_MESSAGES ]; then
            echo "No .po cache directory found, skipping"
            exit 0
          fi

          git add docs/ascend_tutorial/locale/en/LC_MESSAGES/
          if git diff --cached --quiet; then
            echo "No .po cache changes to commit"
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          # Commit directly on main (we are still on main here — the clean
          # branch is not created until Step 8).
          git commit -s -m "chore: update .po translation memory"

          git remote set-url origin "https://x-access-token:${FORK_TOKEN}@github.com/${FORK_REPO}.git"
          git push origin "${TARGET_BRANCH}"
          echo "Updated .po translation memory pushed to fork main"

      # -----------------------------------------------------------------
      # Step 7: Process translated files.
      # Filter the results JSON to only include en/ docs (not .po cache),
      # since the PR to the upstream only carries en/ docs.
      # -----------------------------------------------------------------
      - name: Process translated files
        if: steps.detect.outputs.has_changes == 'true'
        id: results
        run: |
          if [ ! -f /tmp/translation_results.json ]; then
            echo "No translation results found"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Only include en/ docs — the .po cache stays in the fork and
          # must not appear in the PR to the upstream.
          success_files=$(python3 -c "
          import json
          with open('/tmp/translation_results.json') as f:
              data = json.load(f)
          for p in data.get('success_files', []):
              if p.startswith('docs/ascend_tutorial/en/'):
                  print(p)
          ")

          if [ -z "$success_files" ]; then
            echo "No en/ docs to translate - nothing to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          count=0
          file_list=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              count=$((count + 1))
              file_list="${file_list}- <code>${file}</code>"$'\n'
            fi
          done <<< "$success_files"

          [ $count -eq 0 ] && echo "No files to commit" && echo "has_changes=false" >> $GITHUB_OUTPUT && exit 0
          echo "Found $count translated en/ file(s)"
          {
            echo "has_changes=true"
            echo "file_count=$count"
            echo "file_list<<EOF"
            echo "$file_list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Step 8: Create clean branch and commit.
      # Based on the fork's synced main, create a new branch. git rm .po
      # files, python script, and skill file from the branch so the PR to
      # the upstream verl source repo only carries en/ docs and workflow
      # files. Since the upstream does not have these tooling files, the
      # deletions produce no diff in the cross-repo PR.
      # -----------------------------------------------------------------
      - name: Create clean branch and commit
        if: steps.results.outputs.has_changes == 'true'
        id: ci_branch
        env:
          FORK_TOKEN: ${{ steps.tokens.outputs.fork_token }}
        run: |
          set -euo pipefail

          # Fixed branch name: every run updates the same branch so only one
          # PR stays open. force-push overwrites the previous state.
          BRANCH_NAME="auto-pr/doc-translate"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          # Reset the branch to the current HEAD (creates it if absent).
          git checkout -B "${BRANCH_NAME}"

          # Delete translation tooling and .po cache from the branch —
          # these only live in the fork, not in the upstream repo.
          # --ignore-unmatch: no error if the path does not exist.
          git rm -r --ignore-unmatch docs/ascend_tutorial/locale/
          git rm --ignore-unmatch .github/workflows/scripts/translate_md.py
          git rm -r --ignore-unmatch .agent/skills/translate-ascend/

          # Stage only the en/ docs and workflow files.
          git add docs/ascend_tutorial/en/
          git add .github/workflows/

          # Safety net 1: no additions/modifications outside en/ docs and
          # workflows/ (deletions of .po/.py/.skill are allowed — they
          # produce no diff in the cross-repo PR since the upstream does
          # not have them).
          leaked=$(git diff --cached --diff-filter=AM --name-only \
            | grep -vE '^(docs/ascend_tutorial/en/|\.github/workflows/)' || true)
          if [ -n "${leaked}" ]; then
            echo "::error::Unexpected path(s) staged for the pull request: ${leaked}"
            exit 1
          fi

          # Safety net 2: no translation tooling staged as additions.
          junk=$(git diff --cached --diff-filter=AM --name-only \
            | grep -E '\.po$|translate_md\.py|skill\.md' || true)
          if [ -n "${junk}" ]; then
            echo "::error::Translation tooling staged as addition: ${junk}"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No documentation changes to deliver"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          file_count=$(git diff --cached --diff-filter=AM --name-only | wc -l)
          git commit -s -m "[doc] feat: Auto-translate Chinese docs to English (${file_count} file(s))"

          # Push the clean branch to the fork (force: overwrite previous
          # state so the existing PR is updated instead of opening a new one).
          git remote set-url origin "https://x-access-token:${FORK_TOKEN}@github.com/${FORK_REPO}.git"
          git push origin "${BRANCH_NAME}" --force

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Step 9: Create Pull Request to the upstream verl source repo.
      # Uses GITHUB_TOKEN (pull-requests:write on this repo) to create a
      # cross-repository PR from fork-owner:branch to this repo.
      # -----------------------------------------------------------------
      - name: Create Pull Request to upstream
        if: steps.ci_branch.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FILE_LIST: ${{ steps.results.outputs.file_list }}
          FILE_COUNT: ${{ steps.results.outputs.file_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${{ env.BRANCH_NAME }}" ]; then
            echo "Error: BRANCH_NAME not set"
            exit 1
          fi

          DATE=$(date +%Y-%m-%d)
          # PR title must pass tests/special_sanity/check_pr_title.py:
          #   [BREAKING][module] type: description
          #   module in {doc, ...}, type in {feat, fix, refactor, chore, test}
          TITLE="[doc] feat: Auto-translate Chinese docs to English ${DATE}"

          # Cross-repository PR: head is fork-owner:branch.
          PR_HEAD="${FORK_OWNER}:${{ env.BRANCH_NAME }}"

          BODY=$(cat <<-BODYEOF
          ## Auto-Translation Summary

          Translated **${FILE_COUNT}** file(s):

          ${FILE_LIST}

          This PR uses the **cross-repository doc translation workflow**:
          - The workflow runs in this repo (${{ github.repository }}) and checks out the fork private repo that carries the translation tooling
          - The fork's main branch is synced with the latest upstream to get the latest Chinese docs
          - Chinese docs under `docs/ascend_tutorial/zh/` are translated via LLM API into English
          - English docs are written to `docs/ascend_tutorial/en/` (same format, mirrored directory structure)
          - Translation tooling (`translate_md.py`, `skill.md`, `.po` cache) lives only in the fork
          - This PR only carries English docs and workflow files

          ---

          [Workflow run](${RUN_URL})

          > This PR was automatically generated by the scheduled doc translation workflow.
          BODYEOF
          )

          if gh pr create \
            --repo "${{ github.repository }}" \
            --base "${TARGET_BRANCH}" \
            --head "${PR_HEAD}" \
            --title "${TITLE}" \
            --body "${BODY}" 2>&1; then
            echo "Pull request created successfully"
          else
            # A PR already exists for this head/base pair. Update its title
            # and body so it reflects the latest translation run instead of
            # silently failing and leaving a stale PR.
            EXISTING_PR=$(gh pr list \
              --repo "${{ github.repository }}" \
              --base "${TARGET_BRANCH}" \
              --head "${PR_HEAD}" \
              --state open \
              --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "${EXISTING_PR}" ]; then
              gh pr edit "${EXISTING_PR}" \
                --repo "${{ github.repository }}" \
                --title "${TITLE}" \
                --body "${BODY}" \
                && echo "Updated existing PR #${EXISTING_PR}"
            else
              echo "::error::gh pr create failed and no existing PR found to update. Check token permissions on ${{ github.repository }}."
              exit 1
            fi
          fi
