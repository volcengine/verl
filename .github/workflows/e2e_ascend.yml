# # Tests layout

# Each folder under tests/ corresponds to a test category for a sub-namespace in verl. For instance:
# - `tests/trainer` for testing functionality related to `verl/trainer`
# - `tests/models` for testing functionality related to `verl/models`
# - ...

# There are a few folders with `special_` prefix, created for special purposes:
# - `special_distributed`: unit tests that must run with multiple GPUs
# - `special_e2e`: end-to-end tests with training/generation scripts
# - `special_npu`: tests for NPUs
# - `special_sanity`: a suite of quick sanity tests
# - `special_standalone`: a set of test that are designed to run in dedicated environments

# Accelerators for tests
# - By default tests are run with GPU available, except for the ones under `special_npu`, and any test script whose name ends with `on_cpu.py`.
# - For test scripts with `on_cpu.py` name suffix would be tested on CPU resources in linux environment.

# # Workflow layout

# All CI tests are configured by yaml files in `.github/workflows/`. Here's an overview of all test configs:
# 1. A list of always triggered CPU sanity tests: `check-pr-title.yml`, `secrets_scan.yml`, `check-pr-title,yml`, `pre-commit.yml`, `doc.yml`
# 2. Some heavy multi-GPU unit tests, such as `model.yml`, `vllm.yml`, `sgl.yml`
# 3. End-to-end tests: `e2e_*.yml`
# 4. Unit tests
#   - `cpu_unit_tests.yml`, run pytest on all scripts with file name pattern `tests/**/test_*_on_cpu.py`
#   - `gpu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix.
#   - Since cpu/gpu unit tests by default runs all tests under `tests`, please make sure tests are manually excluded in them when
#     - new workflow yaml is added to `.github/workflows`
#     - new tests are added to workflow mentioned in 2.

name: e2e_ascend

on:
  # Trigger on pull requests targeting main or v0.* branches.
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "verl/**/*.py"
      - "verl/trainer/config/**"
      # Entrypoints and fixtures used by the jobs below.
      - ".github/workflows/e2e_ascend.yml"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"
      - "scripts/converter_hf_to_mcore.py"
      - "scripts/init_random_model.py"
      - "tests/special_npu/run_qwen3_06b_ppo.sh"
      - "tests/special_npu/run_qwen3_8b_grpo_profiling.sh"
      - "tests/special_npu/run_qwen3_06b_grpo_mindspeed.sh"
      - "tests/special_npu/run_qwen3_30b_grpo_mindspeed.sh"
      - "tests/special_npu/run_qwen3_vl_8b_Instruct_fsdp2_npu.sh"
      - "tests/special_npu/run_qwen3_5_2b_fsdp_turbo.sh"
      - "tests/special_e2e/ppo_trainer/expert_parallel/qwen3moe_minimal.json"
      - "tests/utils/test_check_profiler_output.py"
      - "tests/special_sanity/check_device_api_usage.py"
      - "pyproject.toml"
      - "requirements-npu.txt"
      - "setup.py"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
 
jobs:
  llm_rl_job:
    if: github.repository_owner == 'verl-project'
    name: E2E Ascend testing for RL training scenarios of LLM models
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: 120
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Install uv
        run: pip install uv
      - name: Check initial pip list from image
        run: |
          uv pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository
        run: |
          uv pip install --no-deps -e .
          uv pip install --no-deps TransferQueue==0.1.11
          pip uninstall -y nvidia-resiliency-ext
      - name: Check final pip list
        run: |
          uv pip list
      - name: Preprocess gsm8k dataset
        run: |
          python examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/.cache/datasets/openai/gsm8k
      - name: Running gsm8k e2e training tests with PPO on ASCEND NPU (FSDP backend)
        run: |
          ray stop --force
          bash tests/special_npu/run_qwen3_06b_ppo.sh
          rm -rf $HOME/ckpts
      - name: Running gsm8k e2e training tests with GRPO on ASCEND NPU (FSDP backend)
        run: |
          ray stop --force
          bash tests/special_npu/run_qwen3_8b_grpo_profiling.sh
          python3 "tests/utils/test_check_profiler_output.py" --profiler_dir="./profiler_data-dis" --device="npu" \
            --stage actor_update actor_compute_log_prob '*_rollout_*'
          rm -rf ./profiler_data-dis
          rm -rf $HOME/ckpts
      - name: Running gsm8k e2e training tests with GRPO on ASCEND NPU (MindSpeed backend)
        run: |
          ray stop --force
          USE_DIST_CKPT=False bash tests/special_npu/run_qwen3_06b_grpo_mindspeed.sh
          rm -rf $HOME/ckpts
      - name: Running gsm8k e2e training tests with GRPO on ASCEND NPU (MindSpeed backend, MoE Model)
        run: |
          ray stop --force
          USE_DIST_CKPT=False USE_DUMMY_MODEL=True DUMMY_MODEL_CONFIG_PATH=tests/special_e2e/ppo_trainer/expert_parallel/qwen3moe_minimal.json DUMMY_MODEL_PATH=$HOME/dist_ckpt/qwen3_30b_grpo_mindspeed bash tests/special_npu/run_qwen3_30b_grpo_mindspeed.sh

  vlm_rl_job:
    if: github.repository_owner == 'verl-project'
    needs: llm_rl_job
    name: E2E Ascend testing for RL training scenarios of VLM models
    runs-on: linux-aarch64-a3-800i-16
    timeout-minutes: 160
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-vllm-a3-ubuntu
      options: >-
        --shm-size 160g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Check initial pip list from image
        run: |
          pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository
        run: |
          pip install --no-deps -e .
          pip install --no-deps TransferQueue==0.1.11
      - name: Check final pip list
        run: |
          pip list
      - name: Preprocess geo3k dataset
        run: |
          python examples/data_preprocess/geo3k.py --local_dataset_path ${HOME}/.cache/datasets/hiyouga/geometry3k
      - name: Running geo3k e2e training tests with GRPO on ASCEND NPU
        run: |
          ray stop --force
          SAVE_FREQ=-1 TOTAL_TRAINING_STEPS=1 bash tests/special_npu/run_qwen3_vl_8b_Instruct_fsdp2_npu.sh
          rm -rf $HOME/ckpts
      - name: Running geo3k e2e training tests with GRPO on ASCEND NPU (FSDP-Turbo backend)
        run: |
          rm -rf /FSDPTurbo
          git clone https://gitcode.com/Ascend/FSDPTurbo.git /FSDPTurbo
          export PYTHONPATH=/FSDPTurbo:$PYTHONPATH
          ray stop --force
          bash tests/special_npu/run_qwen3_5_2b_fsdp_turbo.sh
