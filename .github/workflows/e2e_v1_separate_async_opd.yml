name: e2e_v1_separate_async_opd

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.*
    paths:
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/distillation/**"
      - "verl/trainer/config/**"
      - "verl/experimental/agent_loop/**"
      - "verl/experimental/separation/**"
      - "verl/experimental/teacher_loop/**"
      - "verl/checkpoint_engine/**"
      - "verl/models/**"
      - "verl/single_controller/**"
      - "verl/workers/**"
      - "verl/utils/dataset/**"
      - "verl/utils/megatron_utils.py"
      - "verl/protocol.py"
      - ".github/workflows/e2e_v1_separate_async_opd.yml"
      - "tests/special_e2e/run_v1_separate_async_opd.sh"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"
      # Dependency changes: this job runs `uv run --frozen`, so the lock IS
      # the environment under test - a resolution change must be validated
      # even when it touches no .py file.
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/ppo/**"
      - "verl/trainer/distillation/**"
      - "verl/trainer/config/**"
      - "verl/experimental/agent_loop/**"
      - "verl/experimental/separation/**"
      - "verl/experimental/teacher_loop/**"
      - "verl/checkpoint_engine/**"
      - "verl/models/**"
      - "verl/single_controller/**"
      - "verl/workers/**"
      - "verl/utils/dataset/**"
      - "verl/utils/megatron_utils.py"
      - "verl/protocol.py"
      - ".github/workflows/e2e_v1_separate_async_opd.yml"
      - "tests/special_e2e/run_v1_separate_async_opd.sh"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"
      # Dependency changes: this job runs `uv run --frozen`, so the lock IS
      # the environment under test - a resolution change must be validated
      # even when it touches no .py file.
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130"
  DYNAMIC_RUNNER_ENDPOINT: "https://sd10g3clalm04ug7alq90.apigateway-cn-beijing.volceapi.com/runner"

jobs:
  setup:
    if: github.repository_owner == 'verl-project'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - uses: actions/checkout@v4
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  e2e_v1_separate_async_opd_megatron:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 30
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      # No install step: every command below runs through uv, which syncs .venv
      # from the committed uv.lock. These extras must match what the e2e script
      # picks for this backend combo, or each step would re-sync torch.
      UV_RUN: "uv run --frozen --all-packages --extra vllm --extra megatron"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # Diagnostic: show whether this runner can reach the outside world at all
      # before uv needs it. Never fails the job.
      - name: Keep the uv cache on the runner's persistent ${HOME}
        run: |
          echo "HOME=${HOME} (uv cache baked into the image: ${UV_CACHE_DIR})"
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" | tee -a "${GITHUB_ENV}"
      - name: Check final pip list
        run: |
          $UV_RUN uv pip list
      - name: Prepare datasets
        run: |
          $UV_RUN python3 examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/models/hf_data/gsm8k --local_save_dir ${HOME}/data/gsm8k
          $UV_RUN python3 examples/data_preprocess/geo3k.py --local_dataset_path ${HOME}/models/hf_data/hiyouga/geometry3k/ --local_save_dir ${HOME}/data/geo3k
      - name: Run V1 separate_async with Multi-Teacher OPD
        run: |
          $UV_RUN ray stop --force
          bash tests/special_e2e/run_v1_separate_async_opd.sh

  cleanup:
    runs-on: ubuntu-latest
    needs: [setup, e2e_v1_separate_async_opd_megatron]
    if: always()
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"
