# # Tests layout

# Each folder under tests/ corresponds to a test category for a sub-namespace in verl. For instance:
# - `tests/trainer` for testing functionality related to `verl/trainer`
# - `tests/models` for testing functionality related to `verl/models`
# - ...

# There are a few folders with `special_` prefix, created for special purposes:
# - `special_distributed`: unit tests that must run with multiple GPUs
# - `special_e2e`: end-to-end tests with training/generation scripts
# - `special_npu`: tests for NPUs
# - `special_sanity`: a suite of quick sanity tests
# - `special_standalone`: a set of test that are designed to run in dedicated environments

# Accelerators for tests
# - By default tests are run with GPU available, except for the ones under `special_npu`, and any test script whose name ends with `on_cpu.py`.
# - For test scripts with `on_cpu.py` name suffix would be tested on CPU resources in linux environment.

# # Workflow layout

# All CI tests are configured by yaml files in `.github/workflows/`. Here's an overview of all test configs:
# 1. A list of always triggered CPU sanity tests: `check-pr-title.yml`, `secrets_scan.yml`, `check-pr-title,yml`, `pre-commit.yml`, `doc.yml`
# 2. Some heavy multi-GPU unit tests, such as `model.yml`, `vllm.yml`, `sgl.yml`
# 3. End-to-end tests: `e2e_*.yml`
# 4. Unit tests
#   - `cpu_unit_tests.yml`, run pytest on all scripts with file name pattern `tests/**/test_*_on_cpu.py`
#   - `gpu_unit_tests.yml`, run pytest on all scripts with file without the `on_cpu.py` suffix.
#   - Since cpu/gpu unit tests by default runs all tests under `tests`, please make sure tests are manually excluded in them when
#     - new workflow yaml is added to `.github/workflows`
#     - new tests are added to workflow mentioned in 2.

name: e2e_ppo_trainer_megatron_sglang_ascend

on:
  # Trigger on pull requests targeting main or v0.* branches.
  pull_request:
    branches:
      - main
      - v0.*
    paths:
      - "**/*.py"
      # Other entrypoints
      - "!docker/**"
      # Docs
      - "!**/*.md"
      - "!docs/**"
      - "!examples/**"
      - "!tests/**"
      - "!verl/trainer/main_*.py"
      - "!verl/trainer/fsdp_sft_trainer.py" # FSDP
      - "!verl/workers/**/*dp_*.py"
      - "!verl/utils/fsdp_utils.py"
      - "!verl/utils/checkpoint/fsdp_checkpoint_manager.py"
      - "!verl/model_merger/fsdp_model_merger.py"
      # Entrypoints
      - "verl/worksers/rollout/sglang_rollout/*"
      - ".github/workflows/e2e_ppo_trainer_megatron_sglang_ascend.yml"
      - "examples/data_preprocess/gsm8k.py"
      - "examples/data_preprocess/geo3k.py"
      - "tests/special_e2e/run_ppo_trainer_megatron.sh"
      - "verl/trainer/main_ppo.py"
      - "verl/trainer/config/ppo_megatron_trainer.yaml"

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Declare permissions just read content.
permissions:
  contents: read

env:
  # This image is not the uv.cu130 one: it ships its own torch-npu stack, so the
  # shared e2e scripts must launch with ambient python instead of `uv run`
  VERL_USE_UV: 0

jobs:
  # Re-enable both jobs after the SGLang Ascend CI image provides Python 3.12,
  # Megatron-Bridge, and the matching MindSpeed-Bridge stack, validated on A3 NPUs.
  e2e_ppo_trainer_megatron-deepseek_ascend:
    if: ${{ false }}
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: 90 # Increase this timeout value as needed
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-sglang-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      MODEL_PATH: /root/.cache/modelscope/hub/models/deepseek-ai/deepseek-coder-1___3b-instruct
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES: "1"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      HCCL_HOST_SOCKET_PORT_RANGE: "60000-60050"
      HCCL_NPU_SOCKET_PORT_RANGE: "61000-61050"
      ENGINE: sglang
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Install uv
        run: pip install uv
      - name: Check initial pip list from image
        run: |
          uv pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository 
        run: |
          uv pip install pytest pytest-asyncio
          uv pip install --no-deps --no-build-isolation -e .
      - name: Check final pip list
        run: |
          uv pip list
      - name: Prepare weights
        run: |
          ln -s /root/.cache/modelscope/hub/models ~/models
      - name: Prepare GSM8K dataset
        run: |
          python examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/.cache/datasets/openai/gsm8k
      - name: Running GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (DeepSeek)
        run: |
          ray stop --force
          OPTIM_MEMORY_EFFICIENT=True ENGINE=sglang COMMON_VPP=NULL USE_REMOVE_PADDING=True SAVE_FREQ=1 MODEL_ID=deepseek-ai/deepseek-coder-1.3b-instruct bash tests/special_e2e/run_ppo_trainer_megatron.sh
      - name: Running GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (DeepSeek)
        run: |
          ray stop --force
          export VLLM_USE_V1=1
          ray start --head
          ENGINE=sglang MODE=async RESUME_MODE=auto COMMON_VPP=NULL USE_REMOVE_PADDING=True MODEL_ID=deepseek-ai/deepseek-coder-1.3b-instruct TOTAL_TRAIN_STEPS=2 bash tests/special_e2e/run_ppo_trainer_megatron.sh
      - name: Profiling GRPO GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (Deepseek)
        run: |
          ray stop --force
          PROFILE_ENABLE=True ENGINE=sglang ADV_ESTIMATOR=grpo USE_DYNAMIC_BSZ=False USE_REMOVE_PADDING=True MODEL_ID=deepseek-ai/deepseek-coder-1.3b-instruct bash tests/special_e2e/run_ppo_trainer_megatron.sh
          if [ -z "$( ls -A "${HOME}/profiling" )" ]; then
            echo "[ERROR] not found any profiling files"
            exit 1
          else
            echo "[SUCCESS] profile success"
          fi
      - name: clean up
        run: |
          rm -rf checkpoints
          rm -rf "${HOME}/profiling"

  # Qwen3-0.6B: dense, tie_word_embeddings=True
  e2e_ppo_trainer_megatron-qwen3:
    if: ${{ false }}
    runs-on: linux-aarch64-a3-800i-8
    timeout-minutes: 90 # Increase this timeout value as needed
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ascend-ci/verl/verl:latest-sglang-a3-ubuntu
      options: >-
        --shm-size 16g
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0" # This is more stable
      RAY_EXPERIMENTAL_NOSET_ASCEND_RT_VISIBLE_DEVICES: "1"
      ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      HCCL_HOST_SOCKET_PORT_RANGE: "60000-60050"
      HCCL_NPU_SOCKET_PORT_RANGE: "61000-61050"
      ENGINE: sglang
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      UV_HTTP_TIMEOUT: 120
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      TRANSFORMERS_VERBOSITY: 'error'
    steps:
      - name: Check npu and CANN info
        run: |
          cat /usr/local/Ascend/ascend-toolkit/latest/"$(uname -i)"-linux/ascend_toolkit_install.info
          npu-smi info
      - name: Install uv
        run: pip install uv
      - name: Check initial pip list from image
        run: |
          uv pip list
      - name: Checkout verl-project/verl repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Install the current repository 
        run: |
          uv pip install pytest pytest-asyncio
          uv pip install --no-deps --no-build-isolation -e .
      - name: Check final pip list
        run: |
          uv pip list
      - name: Prepare weights
        run: |
          ln -s /root/.cache/modelscope/hub/models ~/models
      - name: Prepare GSM8K dataset
        run: |
          python examples/data_preprocess/gsm8k.py --local_dataset_path ${HOME}/.cache/datasets/openai/gsm8k
      - name: Running GSM8K E2E training tests with 3D parallelism on 8 NPUs with Megatron (Qwen3) testing learning rate scheduler
        run: |
          ray stop --force
          ALL_OFFLOAD=True USE_REMOVE_PADDING=True VAL_BEFORE_TRAIN=True TEST_FREQ=1 SAVE_FREQ=1 LR_WARMUP_STEPS=1 TOTAL_TRAIN_STEPS=2 MODEL_ID=Qwen/Qwen3-0.6B bash tests/special_e2e/run_ppo_trainer_megatron.sh
      - name: clean up
        run: |
          rm -rf checkpoints
