# This reference configration yaml is automatically generated via 'scripts/generate_trainer_config.sh'
# in which it invokes 'python3 scripts/print_cfg.py --cfg job model_engine=megatron' to flatten the 'verl/trainer/config/ppo_trainer.yaml' config fields into a single file.
# Do not modify this file directly.
# The file is usually only for reference and never used.

actor_rollout_ref:
  actor:
    optim:
      _target_: verl.workers.config.McoreOptimizerConfig
      lr: 1.0e-06
      lr_warmup_steps_ratio: 0.0
      total_training_steps: -1
      weight_decay: 0.01
      lr_warmup_steps: -1
      betas:
      - 0.9
      - 0.999
      clip_grad: 1.0
      optimizer: adam
      lr_warmup_init: 0.0
      lr_decay_steps: null
      lr_decay_style: constant
      min_lr: 0.0
      weight_decay_incr_style: constant
      lr_wsd_decay_style: exponential
      lr_wsd_decay_steps: null
      use_checkpoint_opt_param_scheduler: false
      use_precision_aware_optimizer: false
      main_grads_dtype: fp32
      exp_avg_dtype: fp32
      exp_avg_sq_dtype: fp32
      use_layer_wise_distributed_optimizer: false
      muon_momentum: 0.95
      muon_nesterov: false
      muon_split_qkv: true
      muon_scale_mode: spectral
      muon_coefficient_type: quintic
      muon_num_ns_steps: 5
      muon_tp_mode: blockwise
      muon_fp32_matmul_prec: medium
      muon_extra_scale_factor: 1.0
      muon_scalar_optimizer: adam
      muon_match_adamw_update_rms: false
      override_optimizer_config: {}
    megatron:
      _target_: verl.workers.config.McoreEngineConfig
      param_offload: false
      optimizer_offload: false
      tensor_model_parallel_size: 1
      expert_model_parallel_size: 1
      expert_tensor_parallel_size: null
      pipeline_model_parallel_size: 1
      virtual_pipeline_model_parallel_size: null
      context_parallel_size: 1
      sequence_parallel: true
      use_distributed_optimizer: true
      use_dist_checkpointing: false
      dist_checkpointing_path: null
      dynamic_context_parallel: false
      max_seqlen_per_dp_cp_rank: null
      dist_checkpointing_prefix: ''
      dist_ckpt_optim_fully_reshardable: false
      distrib_optim_fully_reshardable_mem_efficient: false
      entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,False}
      entropy_from_logits_chunk_size: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_chunk_size,2048}
      seed: 42
      override_ddp_config: {}
      override_transformer_config:
        recompute_granularity: null
        recompute_modules:
        - core_attn
        recompute_method: null
        recompute_num_layers: null
        attention_backend: flash
      override_mcore_model_config: {}
      use_mbridge: true
      use_remove_padding: true
      pad_bshd_to_minibatch_max: true
      pad_to_length: false
      pad_to_length_bucket: 512
      use_megatron_fsdp: false
      forward_only: false
      dtype: bfloat16
      router_replay:
        _target_: verl.workers.config.EngineRouterReplayConfig
        mode: disabled
        record_file: null
        replay_file: null
      qat:
        _target_: verl.workers.config.QATEngineConfig
        enable: false
        mode: w4a16
        group_size: 16
        ignore_patterns:
        - lm_head
        - '*mlp.gate'
        activation_observer: null
        quantization_config_path: null
    _target_: verl.workers.config.McoreActorConfig
    rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}
    strategy: megatron
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 16384
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    tau_pos: 1.0
    tau_neg: 1.05
    freeze_vision_tower: false
    policy_loss:
      _target_: verl.workers.config.PolicyLossConfig
      loss_mode: vanilla
      clip_cov_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
      kl_cov_ratio: 0.0002
      ppo_kl_coef: 0.1
      dro_beta: null
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    loss_scale_factor: null
    entropy_coeff: 0
    calculate_entropy: false
    calculate_sum_pi_squared: false
    use_kl_loss: false
    use_prefix_grouper: false
    use_torch_compile: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    data_loader_seed: 42
    checkpoint:
      _target_: verl.trainer.config.CheckpointConfig
      save_contents:
      - model
      - optimizer
      - extra
      load_contents: ${.save_contents}
      async_save: false
      strict: true
    use_fused_kernels: ${oc.select:actor_rollout_ref.model.use_fused_kernels,false}
    profiler:
      _target_: verl.utils.profiler.ProfilerConfig
      tool: ${oc.select:global_profiler.tool,null}
      enable: false
      all_ranks: false
      ranks: []
      save_path: ${oc.select:global_profiler.save_path,null}
      relocate_results: ${oc.select:global_profiler.relocate_results,false}
      finish_hook_cmd: ${oc.select:global_profiler.finish_hook_cmd,null}
      finish_hook_all_ranks: ${oc.select:global_profiler.finish_hook_all_ranks,false}
      finish_hook_ranks: ${oc.select:global_profiler.finish_hook_ranks,[]}
      tool_config:
        nsys:
          _target_: verl.utils.profiler.config.NsightToolConfig
          discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}
        npu:
          _target_: verl.utils.profiler.config.NPUToolConfig
          contents: []
          level: level0
          analysis: true
          discrete: false
        torch:
          _target_: verl.utils.profiler.config.TorchProfilerToolConfig
          contents: []
          discrete: false
          schedule:
            _target_: verl.utils.profiler.config.TorchProfilerScheduleConfig
            skip_first: 0
            wait: 0
            warmup: 0
            active: 0
            repeat: 0
        torch_memory:
          _target_: verl.utils.profiler.config.TorchMemoryToolConfig
          trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}
          stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}
          memory_snapshot_num_steps: ${oc.select:global_profiler.global_tool_config.torch_memory.memory_snapshot_num_steps,1}
        precision_debugger:
          _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig
          config_path: ${oc.select:global_profiler.global_tool_config.precision_debugger.config_path,null}
          steps: null
          stages: ${oc.select:global_profiler.global_tool_config.precision_debugger.stages,null}
          strict: ${oc.select:global_profiler.global_tool_config.precision_debugger.strict,False}
    qat:
      enable: false
      mode: w4a16
      group_size: 16
      ignore_patterns:
      - lm_head
      - embed_tokens
      - re:.*mlp.gate$
      activation_observer: static_minmax
      quantization_config_path: null
    entropy_from_logits_with_chunking: false
    entropy_from_logits_chunk_size: 2048
  ref:
    rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}
    strategy: megatron
    use_torch_compile: ${oc.select:actor_rollout_ref.actor.use_torch_compile,true}
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${oc.select:actor_rollout_ref.actor.use_dynamic_bsz,false}
    log_prob_max_token_len_per_gpu: ${oc.select:actor_rollout_ref.actor.ppo_max_token_len_per_gpu,16384}
