# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.CriticConfig

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

# fsdp or fsdp2 strategy used for critic model training
strategy: ???

# whether to enable the critic worker.
# by default it is only enabled if advantage estimator is gae
# set it to True manually if you always want to enable critic worker
enable: null

# optimizer configs
optim:

  # Learning rate
  lr: 1e-5

  # Warmup steps ratio; total steps will be injected at runtime
  lr_warmup_steps_ratio: 0.0

  # Total training steps (must be overridden at runtime)
  total_training_steps: -1

  # Weight decay
  weight_decay: 0.01

  # Prioritized. None, 0 or Negative values mean delegating to lr_warmup_steps_ratio.
  lr_warmup_steps: -1

# PPO mini-batch size per update
ppo_mini_batch_size: ${oc.select:actor_rollout_ref.actor.ppo_mini_batch_size,256}

# [Deprecated] Global micro batch size
ppo_micro_batch_size: null

# Local per-GPU micro batch size
ppo_micro_batch_size_per_gpu: ${oc.select:.ppo_micro_batch_size,null}

# Whether to automatically adjust batch size at runtime
use_dynamic_bsz: ${oc.select:actor_rollout_ref.actor.use_dynamic_bsz,false}

# Max tokens per GPU in one PPO batch (doubled for critic)
ppo_max_token_len_per_gpu: 32768

# Max token length per GPU in forward pass
forward_max_token_len_per_gpu: ${.ppo_max_token_len_per_gpu}

# Number of PPO epochs per batch
ppo_epochs: ${oc.select:actor_rollout_ref.actor.ppo_epochs,1}

# Shuffle training data across PPO epochs
shuffle: ${oc.select:actor_rollout_ref.actor.shuffle,false}

# The seed used to construct mini-batch
data_loader_seed: 42

# PPO value function clipping range
cliprange_value: 0.5

# Loss aggregation mode: "token-mean", "seq-mean-token-sum", or "seq-mean-token-mean"
loss_agg_mode: ${oc.select:actor_rollout_ref.actor.loss_agg_mode,token-mean}

# Scale factor for "seq-mean-token-sum-norm" loss aggregation mode.
# If null, uses response_length. Set to a constant to ensure consistent normalization.
loss_scale_factor: ${oc.select:actor_rollout_ref.actor.loss_scale_factor,null}

# checkpoint configs
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.trainer.config.CheckpointConfig

  # What to include in saved checkpoints
  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
  save_contents: ['model', 'optimizer', 'extra']

  # What to include when loading checkpoints
  load_contents: ${.save_contents}

  # Whether to save checkpoints asynchronously. Only effective for Megatron as of now.
  async_save: False

# profile the critic model in `update_critic`
profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # profiler tool, default same as profiler.tool in global config
  # choices: nsys, npu, torch, torch_memory
  tool: ${oc.select:global_profiler.tool,null}

  # whether enable profile on Critic
  enable: False

  # Whether to profile all ranks.
  all_ranks: False

  # The ranks that will be profiled. [] or [0,1,...]
  ranks: []

  # profile results saving path
  save_path: ${oc.select:global_profiler.save_path,null}

  # When profiling finishes, move backend artifacts written to a framework-fixed location into
  # save_path. Currently only affects nsys: Ray hardcodes its Nsight output dir
  # (/tmp/ray/session_latest/logs/nsight). Runs on the profiled ranks.
  # Default same as relocate_results in global config.
  relocate_results: ${oc.select:global_profiler.relocate_results,false}

  # Shell command executed on the selected ranks when profiling finishes (after relocate_results).
  # Env vars available: VERL_PROFILE_SAVE_PATH, VERL_PROFILE_TOOL, VERL_PROFILE_RANK,
  # VERL_PROFILE_PID, VERL_PROFILE_ROLE, VERL_PROFILE_RAY_NSIGHT_DIR (nsys only). null disables it.
  # Default same as finish_hook_cmd in global config.
  finish_hook_cmd: ${oc.select:global_profiler.finish_hook_cmd,null}

  # Run finish_hook_cmd on all ranks. Default same as global config.
  finish_hook_all_ranks: ${oc.select:global_profiler.finish_hook_all_ranks,false}

  # Ranks that run finish_hook_cmd. [] or [0,1,...]. Falls back to the profiled ranks when unset.
  # save_path is usually node-local, so pick one rank per node. Default same as global config.
  finish_hook_ranks: ${oc.select:global_profiler.finish_hook_ranks,[]}

  # specific tool config which only related to the role
  tool_config:

    # nsys tool config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig
    
      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}
    
    # npu config
    npu:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NPUToolConfig

      # Contents to profile, can be empty
      # options: npu, cpu, memory, shapes, module, stack
      contents: []

      # Collection level, optional values: level_none, level0, level1, level2.
      level: "level0"

      # Whether to automatically parse the data.
      analysis: True

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False
    
    # torch profiler config
    torch:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      # Contents to profile, can be empty
      # options: cuda, cpu, memory, shapes, stack
      # CPU activity is collected either way, since the per-stage markers (critic_update,
      # compute_values, ...) are CPU-side events and a device-only trace cannot locate them.
      contents: []

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: false

      # Optional torch.profiler.schedule over the critic update loop's mini-batches (see
      # actor.profiler for the full semantics). Enabled only when active > 0; profiler.step()
      # (advanced once per critic update mini-batch) walks it.
      schedule:

        # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
        _target_: verl.utils.profiler.config.TorchProfilerScheduleConfig

        # Mini-batches to skip before the first cycle (discrete only)
        skip_first: 0

        # Idle mini-batches (no collection) at the start of each cycle (discrete only)
        wait: 0

        # Warmup mini-batches (tracing on, data discarded) each cycle (discrete only)
        warmup: 0

        # Mini-batches to record each cycle; <= 0 disables scheduling (record the whole update loop)
        active: 0

        # Number of cycles to repeat; 0 repeats until profiling stops (discrete only)
        repeat: 0

    # torch memory profiler config
    torch_memory:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchMemoryToolConfig

      # Maximum number of memory allocation entries to track
      trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

      # Stack trace depth for memory allocations
      stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

      # Number of profiled RL steps to retain before dumping a memory snapshot.
      memory_snapshot_num_steps: ${oc.select:global_profiler.global_tool_config.torch_memory.memory_snapshot_num_steps,1}

    # msprobe precision debugger config
    precision_debugger:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig

      # Path to msprobe config json
      config_path: ${oc.select:global_profiler.global_tool_config.precision_debugger.config_path,null}

      # Deprecated and ignored. Use global_profiler.steps.
      steps: null

      # Profile stages
      # Supported stages: actor_update, actor_compute_log_prob, ref_compute_log_prob,
      # compute_values, critic_update, compute_rm_score
      stages: ${oc.select:global_profiler.global_tool_config.precision_debugger.stages,null}

      # Whether to fail on unknown stage or missing msprobe
      strict: ${oc.select:global_profiler.global_tool_config.precision_debugger.strict,False}
