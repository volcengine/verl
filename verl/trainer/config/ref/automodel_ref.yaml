# automodel ref config, inheriting from trainer/config/ref/ref.yaml
defaults:
  - ref

  # automodel engine config
  - ../engine@automodel_config: automodel

  # load the reference default config, then apply the fields in the current yaml
  - _self_

_target_: verl.workers.config.AutomodelActorConfig

strategy: automodel

automodel_config:

  # ref model is forward only
  forward_only: True

  # mirror actor engine settings
  param_offload: ${oc.select:actor_rollout_ref.actor.automodel_config.param_offload,false}
  activation_checkpointing: false
  model_dtype: ${oc.select:actor_rollout_ref.actor.automodel_config.model_dtype,fp32}
  attn_implementation: ${oc.select:actor_rollout_ref.actor.automodel_config.attn_implementation,flash_attention_2}
  distributed_strategy: ${oc.select:actor_rollout_ref.actor.automodel_config.distributed_strategy,fsdp2}
  tp_size: ${oc.select:actor_rollout_ref.actor.automodel_config.tp_size,1}
  pp_size: ${oc.select:actor_rollout_ref.actor.automodel_config.pp_size,1}
  cp_size: ${oc.select:actor_rollout_ref.actor.automodel_config.cp_size,1}
  ep_size: ${oc.select:actor_rollout_ref.actor.automodel_config.ep_size,1}
