# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# defaults specify the default config from each component
defaults:

  # fsdp optimizer config
  - ../optim@optim: fsdp

  # fsdp engine config
  - ../engine@fsdp_config: fsdp

  # dp actor config, inheriting from trainer/config/actor/actor.yaml
  - actor

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# Target class for this configuration
_target_: verl.workers.config.FSDPActorConfig

# TODO(haibin.lin): switch to fsdp2
strategy: fsdp

# Gradient clipping for actor updates, specific to the strategy.
grad_clip: 1.0

# Sequence parallelism size for Ulysses-style model parallelism
# oc.select: the default val for ref.ulysses_sequence_parallel_size
# [DEPRECATED] use fsdp_config.ulysses_sequence_parallel_size instead
ulysses_sequence_parallel_size: 1

# calculate entropy with chunking to reduce memory peak
entropy_from_logits_with_chunking: False

# chunk size for entropy from logits with chunking
entropy_from_logits_chunk_size: 2048

# recompute entropy
entropy_checkpointing: False

# round every packed micro-batch up to a fsdp_config.pad_to_length_bucket multiple, so kernel
# shapes take only a few distinct values
# oc.select: the default val for ref.pad_to_length
pad_to_length: False

# fsdp config
fsdp_config:

  # Whether to use chunked entropy computation
  entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,False}

  # Chunk size used by chunked entropy computation
  entropy_from_logits_chunk_size: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_chunk_size,2048}

  # Whether to recompute entropy
  entropy_checkpointing: ${oc.select:actor_rollout_ref.actor.entropy_checkpointing,False}

  # Whether to pad packed micro-batches to a bucket-aligned length
  pad_to_length: ${oc.select:actor_rollout_ref.actor.pad_to_length,False}

# Whether to remove padding tokens in inputs during training
use_remove_padding: ${oc.select:actor_rollout_ref.model.use_remove_padding,false}

# Whether to use length-grouped micro-batches.
use_length_grouped_bsz: ${oc.select:actor_rollout_ref.model.use_length_grouped_bsz,false}
