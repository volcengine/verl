# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.utils.profiler.ProfilerConfig

# profiler tool, default same as profiler.tool in global config
# choices: nsys, npu, torch
tool: torch

# whether enable profile on Actor
enable: False

# Whether to profile all ranks.
all_ranks: False

# The ranks that will be profiled. [] or [0,1,...]
ranks: []

# profile results saving path
save_path: "outputs/profile"

# When profiling finishes, move backend artifacts written to a framework-fixed location into
# save_path. Two backends write outside the flat layout: nsys, because Ray hardcodes the Nsight
# output directory (/tmp/ray/session_latest/logs/nsight), and the rollout engines, which only
# accept a directory and so write into a per-replica sub-directory. Enabling this pulls both into
# save_path itself. Runs on the profiled ranks.
relocate_results: False

# Shell command executed on the selected ranks ONCE, after the last profiled step (relocate_results
# still runs every profiled step, so traces accumulate in save_path). Meant to ship them off the
# node in one shot, e.g. 'mlx asset upload "$VERL_PROFILE_SAVE_PATH"'; running once means uploading
# the whole save_path sends each trace exactly once. Exported env: VERL_PROFILE_SAVE_PATH,
# VERL_PROFILE_TOOL, VERL_PROFILE_RANK, VERL_PROFILE_PID, VERL_PROFILE_ROLE (if known) and
# VERL_PROFILE_RAY_NSIGHT_DIR (nsys only). null disables it.
finish_hook_cmd: null

# Run finish_hook_cmd on all ranks.
finish_hook_all_ranks: False

# Ranks that run finish_hook_cmd. [] or [0,1,...]. When both this and finish_hook_all_ranks are
# unset, the hook falls back to the profiled ranks (all_ranks / ranks). save_path is usually
# node-local, so choose one rank per node here to upload that node's directory once.
finish_hook_ranks: []

tool_config:
  npu:
    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.utils.profiler.config.NPUToolConfig

    # Contents to profile, can be empty
    # options: npu, cpu, memory, shapes, module, stack
    contents: [ ]

    # Collection level, optional values: level_none, level0, level1, level2.
    level: "level0"

    # Whether to automatically parse the data.
    analysis: True

    # True for each task has its own database, False for all tasks in one training step share one database.
    discrete: False

    # Start collecting profiler data from this response-token index.
    # null means collect from the first response token (full collection start).
    profile_token_start: null

    # Stop collecting profiler data at this response-token index (exclusive).
    # null means collect until the end (full collection).
    profile_token_end: null

    name: npu


  nsys:
    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.utils.profiler.config.NsightToolConfig

    # True for each task has its own database, False for all tasks in one training step share one database.
    discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}

    name: nsight

  torch:
    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.utils.profiler.config.TorchProfilerToolConfig

    # Contents to profile, can be empty
    # options: cuda, cpu, memory, shapes, stack
    # CPU activity is collected either way, since the per-stage markers (update_actor,
    # compute_log_prob, ...) are CPU-side events and a device-only trace cannot locate them.
    contents: []

    # True for each task has its own database, False for all tasks in one training step share one database.
    discrete: false

    # Start collecting profiler data from this response-token index.
    # null means collect from the first response token (full collection start).
    profile_token_start: null

    # Stop collecting profiler data at this response-token index (exclusive).
    # null means collect until the end (full collection).
    profile_token_end: null

    # Optional torch.profiler.schedule over the update loop's mini-batches. Enabled only when
    # active > 0, in which case profiler.step() (advanced once per update mini-batch) walks it.
    # discrete: true  -> the update stage gets its own scheduled trace; skip_first/wait/warmup
    #                    drop leading mini-batches and only the active window is kept. Log-prob
    #                    and rollout stages get their own full traces.
    # discrete: false -> one continuous trace per process keeps every stage in full plus the
    #                    first `active` update mini-batches; skip_first/wait/warmup/repeat are
    #                    ignored (dropping leading mini-batches would also drop the earlier stages).
    # Either mode: no "ProfilerStep#<n>" rows are written (a step() here is a mini-batch, not an RL
    # step); the sub-sampling still happens, only the boundary labels are suppressed.
    schedule:
      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerScheduleConfig

      # Mini-batches to skip before the first cycle (discrete only)
      skip_first: 0

      # Idle mini-batches (no collection) at the start of each cycle (discrete only)
      wait: 0

      # Warmup mini-batches (tracing on, data discarded) each cycle (discrete only)
      warmup: 0

      # Mini-batches to record each cycle; <= 0 disables scheduling (record the whole update loop)
      active: 0

      # Number of cycles to repeat; 0 repeats until profiling stops (discrete only)
      repeat: 0

    name: torch

  torch_memory:
    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.utils.profiler.config.TorchMemoryToolConfig

    # Maximum number of memory allocation entries to track
    trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

    # Stack trace depth for memory allocations
    stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

    # Number of profiled RL steps to retain before dumping a memory snapshot.
    memory_snapshot_num_steps: ${oc.select:global_profiler.global_tool_config.torch_memory.memory_snapshot_num_steps,1}

    name: torch_memory

  precision_debugger:
    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig

    # Path to msprobe config json
    config_path: ${oc.select:global_profiler.global_tool_config.precision_debugger.config_path,null}

    # Deprecated and ignored. Use global_profiler.steps.
    steps: null

    # Profile stages
    stages: ${oc.select:global_profiler.global_tool_config.precision_debugger.stages,null}

    name: precision_debugger
