# Target class for this configuration
_target_: verl.workers.config.TorchtitanEngineConfig

# Synchronize phase boundaries to report forward/backward and optimizer wall time.
enable_update_phase_timing: false

# Whether to offload model parameters to CPU
param_offload: False

# Whether to offload optimizer state to CPU
optimizer_offload: False

# policy for wrapping the model
wrap_policy:
  # Minimum number of parameters to trigger wrapping a layer with FSDP
  min_num_params: 0

# The policy for applying `reshard_after_forward` within an FSDP setup
# Options: "default", "always", "never"
reshard_after_forward: default

# Prefetch the next forward-pass all-gather before the current forward computation.
forward_prefetch: false

# Whether to use original parameters
use_orig_params: false

# Mixed precision configuration for FSDP
mixed_precision: false

# Whether to use torch compile
use_torch_compile: true

# Whether to use entropy_from_logits_with_chunking
entropy_from_logits_with_chunking: false

# Chunk size for entropy from logits with chunking
entropy_from_logits_chunk_size: 2048

# Whether to use entropy checkpointing
entropy_checkpointing: false

# Data parallel size (FSDP group size)
data_parallel_size: 1

# Data parallel replicate size
data_parallel_replicate_size: 1

# Data parallel shard size
data_parallel_shard_size: 1

# Tensor parallel size
tensor_parallel_size: 1

# Expert parallel size
expert_parallel_size: 1

# Pipeline parallel size
pipeline_parallel_size: 1

# Context parallel size
context_parallel_size: 1

# Attention type for torchtitan's model (e.g., "sdpa", "flex", "varlen")
attn_type: flex

# torchtitan SPMD backend: "partial_dtensor", "full_dtensor", or "spmd_types"
# ("spmd_types" requires torch>=2.14)
spmd_backend: partial_dtensor

# Activation checkpointing mode: "selective", "full", or "none".
# Use "none" with spmd_backend=spmd_types when use_torch_compile=False (eager AC
# recompute runs off the SPMD mesh context); compiled runs are unaffected.
activation_checkpoint: selective

# Maximum sequence length for RoPE cache. If null, defaults to torchtitan's TrainingConfig.seq_len (2048).
max_seq_len: null

# Round every packed micro-batch up to a multiple of `pad_to_length_bucket` tokens, so the packed
# shape only takes a handful of distinct values and torch.compile / kernel autotuning stop
# re-specializing every step. Only applies with use_remove_padding=True. Under context
# parallelism the padded length is additionally aligned to 2 * context_parallel_size.
pad_to_length: false

# Padding granularity in tokens. Only read when pad_to_length=true.
pad_to_length_bucket: 1024

# Strategy
strategy: torchtitan

# Random seed for reproducibility
seed: 42

# Whether to enable full determinism for distributed training, only for debugging
full_determinism: false

# Whether to use forward only
forward_only: false

# Mixed precision training param dtype
dtype: bfloat16
